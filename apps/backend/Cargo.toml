[package]
name = "polybackend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Polymarket trading backend (Rust) for polyos frontend"

[dependencies]
polymarket_client_sdk_v2 = { path = "../../rs-clob-client-v2", features = [
    "clob",
    "gamma",
    "ws",
    "data",
    "tracing",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = { version = "0.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
alloy = { version = "1.6", default-features = false, features = [
    "signer-local",
    "signers",
] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
chrono-tz = "0.10"

[[bin]]
name = "polybackend"
path = "src/main.rs"
